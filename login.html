<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DocuVerify | Login</title>
  <link rel="icon" type="image/svg+xml" href="../assets/images/logo.jpeg">
  <link href="../assets/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="container-fluid">
    <div class="row auth-wrapper">
      <!-- Form side -->
      <div class="col-lg-6 d-flex align-items-center justify-content-center py-5 order-2 order-lg-1">
        <div class="w-100" style="max-width: 440px;">
          <a href="../index.html" class="navbar-brand fw-bold fs-4 text-decoration-none text-dark d-block mb-4"><i class="bi bi-shield-check text-primary"></i> DocuVerify</a>
          <h3 class="fw-bold">Welcome back</h3>
          <p class="text-muted">Enter your credentials to access your account.</p>

          <form id="loginForm">
            <div class="mb-3">
              <label for="email" class="form-label">Email address</label>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label for="password" class="form-label">Password</label>
                <a href="#" class="small text-decoration-none">Forgot password?</a>
              </div>
              <input type="password" class="form-control" id="password" required>
            </div>
            <div class="form-check mb-4">
              <input class="form-check-input" type="checkbox" id="remember">
              <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <div id="loginError" class="alert alert-danger d-none py-2 mb-3"></div>
            <button type="submit" class="btn btn-brand w-100 py-2" id="submitBtn">Login</button>
          </form>

          <p class="text-center mt-4 mb-0">Don't have an account? <a href="signup.html">Sign up</a></p>
        </div>
      </div>

      <!-- Image side -->
      <div class="col-lg-6 auth-image login d-flex align-items-end p-5 order-1 order-lg-2">
        <div class="text-white">
          <h2 class="fw-bold">AI-Powered Verification</h2>
          <p class="mb-0">Detect receipt and invoice fraud instantly with advanced machine learning.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/bootstrap.bundle.min.js"></script>
  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://eqmdiljeffdlvmaqcfru.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_cLnIGyKarOMfhyZz-reSmg_pWxWskE7';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('loginError');
      const btn = document.getElementById('submitBtn');

      btn.disabled = true;
      btn.textContent = "Logging in...";
      errorBox.classList.add('d-none');

      // Authenticate with Supabase Auth
      const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: password,
      });

      if (error) {
        errorBox.textContent = "Invalid email or password! Please check your credentials or sign up first.";
        errorBox.classList.remove('d-none');
        btn.disabled = false;
        btn.textContent = "Login";
        return;
      }

      // Success! Redirect to your app's dashboard
     window.location.href = 'account.html';
}
    );
  </script>
</body>
</html>
